# Tests, builds and publishes the site to GitHub Pages.
# Runs on every push to main, twice a day to refresh the news, and on demand.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"   # about 7am US Eastern
    - cron: "0 22 * * *"   # about 6pm US Eastern
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # stop here, without publishing, if any test fails (Node comes with the runner)
      - name: Run tests
        run: node tests/run.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's news
        run: python scripts/fetch_news.py
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
