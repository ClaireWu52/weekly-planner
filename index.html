<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Planner</title>
  <meta name="description" content="Schedule, tasks, habits, health, yearly goals, reading and a growth log in one page. 课表、任务、习惯、健康、年度目标、学习清单和成长记录。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="计划本">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1217" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <style id="pageStyle">@page { size: letter landscape; margin: 0; }</style>
</head>
<body>

<header class="app-header">
  <a class="app-brand" href="#/today">
    <img src="favicon.svg" alt="" width="26" height="26">
    <span data-i18n="app.brand"></span>
  </a>
  <nav class="app-nav" aria-label="Pages">
    <a href="#/today" data-nav="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      <span data-i18n="app.nav.today"></span>
    </a>
    <a href="#/tasks" data-nav="tasks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.2l2.8 2.8 5.2-6"/></svg>
      <span data-i18n="app.nav.tasks"></span>
    </a>
    <a href="#/schedule" data-nav="schedule">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span data-i18n="app.nav.schedule"></span>
    </a>
    <a href="#/health" data-nav="health">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.4A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.5 2.5c0 5.8-7.5 10.4-7.5 10.4z"/><path d="M7 12.5h3l1.3-2.5 2 4.5 1.2-2h2.5"/></svg>
      <span data-i18n="app.nav.health"></span>
    </a>
    <a href="#/goals" data-nav="goals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/></svg>
      <span data-i18n="app.nav.goals"></span>
    </a>
    <a href="#/growth" data-nav="growth">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-6.5 7.5-6.5 0 4.5-3 6.5-7.5 6.5z"/><path d="M12 15c0-3.3-2.5-5.5-6.5-5.5 0 3.8 2.5 5.5 6.5 5.5z"/></svg>
      <span data-i18n="app.nav.growth"></span>
    </a>
    <a href="#/life" data-nav="life">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M9.5 20v-5.5h5V20"/></svg>
      <span data-i18n="app.nav.life"></span>
    </a>
  </nav>
  <div class="header-tools">
  <div class="seg sm lang-seg" role="group" aria-label="Language">
    <button type="button" data-setlang="zh" lang="zh-CN">中文</button>
    <button type="button" data-setlang="en" lang="en">EN</button>
  </div>
  <div class="menu-wrap" id="menuWrap">
    <button class="icon-btn lg" id="moreBtn" aria-haspopup="true" aria-expanded="false" data-i18n-aria="app.more">⋯</button>
    <div class="menu" id="menu" hidden>
      <button data-act="undo"><span data-i18n="app.undo"></span><kbd id="undoKbd"></kbd></button>
      <hr>
      <button data-act="customize"><span data-i18n="app.customize"></span></button>
      <button data-act="sync"><span data-i18n="app.sync"></span><span class="menu-val" id="syncVal"></span></button>
      <button data-act="install"><span data-i18n="app.install"></span></button>
      <button data-act="calendar"><span data-i18n="app.calendar"></span></button>
      <button data-act="export"><span data-i18n="app.exportData"></span></button>
      <button data-act="import"><span data-i18n="app.importData"></span></button>
      <button data-act="resetSchedule"><span data-i18n="app.resetSchedule"></span></button>
      <hr>
      <button data-act="theme"><span data-i18n="app.theme"></span><span class="menu-val" id="themeVal"></span></button>
      <button data-act="lang"><span data-i18n="app.langSwitch"></span></button>
      <button data-act="keys"><span data-i18n="app.shortcuts"></span></button>
    </div>
  </div>
  </div>
</header>

<main>
  <nav class="subnav" id="subnav" aria-label="Sub pages" hidden></nav>
  <section class="app-view" id="view-today" hidden></section>
  <section class="app-view" id="view-news" hidden></section>
  <section class="app-view" id="view-tasks" hidden></section>

  <section class="app-view" id="view-schedule" hidden>
    <div class="sched-head">
      <div class="brand">
        <input id="title" class="title-input" maxlength="40" autocomplete="off" spellcheck="false" data-i18n-aria="planner.titleAria">
        <div class="weekrow">
          <button class="icon-btn" id="prevWeek" data-i18n-aria="planner.prevWeek">‹</button>
          <button class="pill" id="thisWeek" data-i18n="planner.thisWeek"></button>
          <button class="icon-btn" id="nextWeek" data-i18n-aria="planner.nextWeek">›</button>
          <h2 class="range" id="range"></h2>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabEdit" aria-selected="true" data-i18n="planner.tabEdit"></button>
        <button role="tab" id="tabPrint" aria-selected="false" data-i18n="planner.tabPrint"></button>
      </div>
      <div class="tools">
        <div class="seg sm view-seg" role="tablist">
          <button type="button" role="tab" id="viewWeek" data-i18n="planner.viewWeek"></button>
          <button type="button" role="tab" id="viewDay" data-i18n="planner.viewDay"></button>
        </div>
        <button class="btn primary" id="newBtn"><span aria-hidden="true">＋</span><span data-i18n="planner.newEvent"></span></button>
      </div>
    </div>

    <div id="editView" class="view">
      <div class="board">
        <div class="grid-card">
          <div class="grid-scroll"><div id="grid" class="grid"></div></div>
          <div class="grid-foot">
            <div class="legend" id="legend"></div>
            <p class="hint" data-i18n="planner.gridHint"></p>
          </div>
        </div>
        <aside class="side" id="side"></aside>
      </div>
      <div class="skipped" id="skipped" hidden></div>
    </div>

    <div id="printView" class="view" hidden>
      <div class="print-layout">
        <form class="print-settings" id="printForm" autocomplete="off"></form>
        <div class="preview-area" id="previewArea">
          <div class="page-frame" id="pageFrame"><div id="printRoot"></div></div>
        </div>
      </div>
    </div>
  </section>

  <section class="app-view" id="view-health" hidden></section>
  <section class="app-view" id="view-plan" hidden></section>
  <section class="app-view" id="view-wishes" hidden></section>
  <section class="app-view" id="view-learn" hidden></section>
  <section class="app-view" id="view-records" hidden></section>
  <section class="app-view" id="view-review" hidden></section>
  <section class="app-view" id="view-food" hidden></section>
  <section class="app-view" id="view-wardrobe" hidden></section>
  <section class="app-view" id="view-travel" hidden></section>
</main>

<!-- schedule event editor -->
<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="dlgForm" novalidate>
    <div class="dlg-head">
      <h2 id="dlgTitle"></h2>
      <span class="badge" id="dlgBadge" hidden></span>
    </div>
    <label class="fld">
      <span data-i18n="planner.fTitle"></span>
      <input class="input" id="fTitle" maxlength="60" autocomplete="off" data-i18n-ph="planner.fTitlePh">
    </label>
    <div class="fld"><span data-i18n="planner.fCat"></span><div class="chips" id="fCat"></div></div>
    <div class="fld"><span data-i18n="planner.fDays"></span><div class="chips" id="fDays"></div></div>
    <div class="fld">
      <span data-i18n="planner.fTime"></span>
      <div class="row">
        <input class="input time" type="time" id="fStart" step="300">
        <span data-i18n="planner.to"></span>
        <input class="input time" type="time" id="fEnd" step="300">
      </div>
      <div class="quick" id="fDurs"></div>
    </div>
    <label class="fld">
      <span data-i18n="planner.fPlace"></span>
      <input class="input" id="fPlace" maxlength="60" autocomplete="off" data-i18n-ph="planner.fPlacePh">
    </label>
    <label class="fld">
      <span data-i18n="planner.fNote"></span>
      <textarea class="input ta" id="fNote" rows="2" maxlength="300" data-i18n-ph="planner.fNotePh"></textarea>
    </label>
    <div class="fld" id="repeatFld"><span data-i18n="planner.fRepeat"></span><div class="chips" id="fRepeat"></div></div>
    <div class="fld" id="rangeFld">
      <span data-i18n="planner.fRange"></span>
      <div class="row">
        <input class="input date" type="date" id="fFrom">
        <span data-i18n="planner.to"></span>
        <input class="input date" type="date" id="fUntil">
      </div>
      <p class="hint" data-i18n="planner.fRangeHint"></p>
    </div>
    <p class="err" id="fErr" role="alert"></p>
    <div class="dlg-foot">
      <div>
        <button type="button" class="btn ghost danger" id="fDel"></button>
        <button type="button" class="btn ghost" id="fSkip" data-i18n="planner.skipThisWeek"></button>
        <button type="button" class="btn ghost" id="fDup" data-i18n="planner.dup"></button>
      </div>
      <div>
        <button type="button" class="btn" id="fCancel" data-i18n="planner.cancel"></button>
        <button type="button" class="btn" id="fSaveWeek" data-i18n="planner.saveThisWeek"></button>
        <button type="submit" class="btn primary" id="fSave"></button>
      </div>
    </div>
  </form>
</dialog>

<!-- shared editor for tasks and wishes -->
<dialog id="formDlg" aria-labelledby="formTitle">
  <form id="formForm" novalidate>
    <div class="dlg-head">
      <h2 id="formTitle"></h2>
      <span class="badge" id="formBadge" hidden></span>
    </div>
    <div id="formBody"></div>
    <p class="err" id="formErr" role="alert"></p>
    <div class="dlg-foot">
      <div><button type="button" class="btn ghost danger" id="formDel"></button></div>
      <div>
        <button type="button" class="btn" id="formCancel" data-i18n="common.cancel"></button>
        <button type="submit" class="btn primary" id="formSave"></button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="js/core.js"></script>
<script src="js/default-schedule.js"></script>
<script src="js/planner.js"></script>
<script src="js/tasks.js"></script>
<script src="js/health.js"></script>
<script src="js/plan.js"></script>
<script src="js/learn.js"></script>
<script src="js/records.js"></script>
<script src="js/wishes.js"></script>
<script src="js/news-data.js"></script>
<script src="js/news.js"></script>
<script src="js/food.js"></script>
<script src="js/wardrobe.js"></script>
<script src="js/travel-calc.js"></script>
<script src="js/travel.js"></script>
<script src="js/travel-book.js"></script>
<script src="js/travel-money.js"></script>
<script src="js/travel-pack.js"></script>
<script src="js/travel-weather.js"></script>
<script src="js/travel-share.js"></script>
<script src="js/review.js"></script>
<script src="js/calendar.js"></script>
<script src="js/sync.js"></script>
<script src="js/today.js"></script>
</body>
</html>
